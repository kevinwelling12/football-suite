<title>Family Club Draft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one column like a matchday programme; each question is a "fixture card", each player a scarf colour. */
:root{
  --ground:#EDF2EA; --surface:#FFFFFF; --ink:#12241A; --muted:#55685C; --line:#CFDACF;
  --pitch:#1E6B45; --flood:#F2C200; --on-flood:#1A1500; --chip:#E3EBE1;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0C1611; --surface:#14221A; --ink:#E8F1EA; --muted:#93A89A; --line:#27392E;
  --pitch:#3FA571; --flood:#F5C400; --on-flood:#1A1500; --chip:#1D2E24; color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#0C1611; --surface:#14221A; --ink:#E8F1EA; --muted:#93A89A; --line:#27392E;
  --pitch:#3FA571; --flood:#F5C400; --on-flood:#1A1500; --chip:#1D2E24; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font:17px/1.5 var(--body);margin:0}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:20px 64px}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.01em;line-height:.95;margin:0;text-wrap:balance}
h1{font-size:clamp(46px,12vw,84px);font-weight:900}
h2{font-size:clamp(30px,7vw,42px);font-weight:800}
h3{font-size:24px;font-weight:800}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--pitch)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--flood);outline-offset:2px}
.btn{border:0;border-radius:12px;padding:14px 20px;font-weight:700;background:var(--chip);color:var(--ink)}
.btn.go{background:var(--flood);color:var(--on-flood);font-family:var(--display);font-size:24px;text-transform:uppercase;letter-spacing:.03em;padding:12px 26px}
.btn:disabled{opacity:.45;cursor:default}
.btn.small{padding:8px 14px;font-size:15px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.scarf{height:12px;border-radius:6px;background:repeating-linear-gradient(90deg,var(--c1) 0 22px,var(--c2) 22px 44px)}
.hero{display:grid;gap:16px;padding-block:8px 6px}
.hero p{max-width:60ch}
/* players */
.players{display:flex;flex-direction:column;gap:10px}
.pl{display:flex;align-items:center;gap:10px}
.pl input{flex:1;min-width:0;font:inherit;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.dot{width:28px;height:28px;border-radius:50%;background:var(--pc);flex:none;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.x{border:0;background:none;color:var(--muted);font-size:22px;padding:4px 8px}
/* question */
.prog{display:flex;gap:4px}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.prog i.on{background:var(--pitch)}
.opts{display:grid;gap:10px}
.opt{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px 16px;text-align:left;display:grid;gap:8px}
.opt.sel{border-color:var(--pitch);box-shadow:0 0 0 1px var(--pitch)}
.opt b{font-size:18px;display:block}
.opt small{color:var(--muted);font-size:15px;display:block}
.who{display:flex;gap:8px;flex-wrap:wrap}
.who button{border:2px solid var(--pc);background:transparent;color:var(--ink);border-radius:999px;padding:5px 12px;font-size:15px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.who button::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--pc)}
.who button[aria-pressed="true"]{background:var(--pc);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45)}
.who button[aria-pressed="true"]::before{background:#fff}
.fact{border-left:6px solid var(--flood);background:var(--surface);border-radius:4px 16px 16px 4px;padding:14px 16px;display:grid;gap:6px}
.fact .eyebrow{color:var(--muted)}
.nav{display:flex;justify-content:space-between;gap:10px;align-items:center}
.waiting{font-size:15px;color:var(--muted)}
/* results */
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{border:2px solid var(--pc,var(--line));background:transparent;border-radius:999px;padding:7px 16px;font-weight:700;color:var(--ink)}
.tabs button[aria-pressed="true"]{background:var(--pc,var(--pitch));color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45)}
.top{display:grid;gap:12px}
.top .scarf{--c1:var(--cc);--c2:color-mix(in srgb,var(--cc) 30%,#fff)}
.big{font-family:var(--display);font-size:clamp(38px,10vw,60px);font-weight:900;line-height:.92;text-transform:uppercase}
.meta{font-size:15px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips span{background:var(--chip);border-radius:999px;padding:4px 10px;font-size:14px;font-weight:700}
.score{font-family:var(--display);font-weight:800;font-size:30px;font-variant-numeric:tabular-nums}
.story{font-size:16px}
.story b{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:block}
.list{display:grid;gap:8px}
.li{display:grid;grid-template-columns:8px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px 12px 0;text-align:left;width:100%;overflow:hidden}
.li i{align-self:stretch;background:var(--cc)}
.li div{min-width:0}
.li strong{display:block;font-size:17px}
.li span.meta{display:block}
.li .score{font-size:24px}
.persona{font-family:var(--display);font-size:30px;font-weight:800;text-transform:uppercase;color:var(--pitch)}
.fam{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.fam .card{display:grid;gap:6px;border-top:6px solid var(--pc)}
.past{display:grid;gap:8px}
details summary{cursor:pointer;font-weight:700}
details p{margin-top:8px;font-size:15px;color:var(--muted)}
.note{font-size:14px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.opt,.who button{transition:border-color .12s,background .12s}}
</style>

<div class="wrap" id="app"></div>

<script>
const CLUBS = __CLUBS__.map(r => ({n:r[0], k:r[1], lg:r[2], co:r[3], col:r[4], ab:r[5], C:r[6], V:r[7], H:r[8], O:r[9], S:r[10], adj:r[11], P:r[12], mi:r[13], hist:r[14], cult:r[15]}));
const KEVIN = ['Liverpool', 'Borussia Dortmund', 'Portland Timbers', 'Portland Thorns', 'Sacramento Republic FC'];
const PCOL = ['#D1495B', '#2E86DE', '#E1A100', '#2F9E62', '#8E5BD6', '#E0702C'];
const STARS = {
  messi:{cur:['Inter Miami CF'], old:['Barcelona', 'Paris Saint-Germain']},
  ronaldo:{cur:[], old:['Manchester United', 'Real Madrid', 'Juventus', 'Sporting CP']},
  mbappe:{cur:['Real Madrid'], old:['Paris Saint-Germain', 'Monaco']},
  haaland:{cur:['Manchester City'], old:['Borussia Dortmund']},
  salah:{cur:['Liverpool'], old:['Chelsea', 'Roma']},
  kane:{cur:['Bayern Munich'], old:['Tottenham Hotspur']},
  son:{cur:['Los Angeles Football Club'], old:['Tottenham Hotspur']},
  pulisic:{cur:['AC Milan'], old:['Borussia Dortmund', 'Chelsea']},
  beckham:{cur:['Inter Miami CF'], old:['Manchester United', 'Real Madrid', 'LA Galaxy']},
  morgan:{cur:[], old:['San Diego Wave', 'Orlando Pride', 'Portland Thorns']},
};
const STAR_NAME = {messi:'Messi', ronaldo:'Ronaldo', mbappe:'Mbappé', haaland:'Haaland', salah:'Salah', kane:'Kane', son:'Son', pulisic:'Pulisic', beckham:'Beckham', morgan:'Alex Morgan'};
const HUES = {red:[355, 1], blue:[222, 1], sky:[205, 1], yellow:[48, 1], green:[145, 1], purple:[275, 1], orange:[25, 1], bw:[0, 0]};

// Each option nudges a profile: w = factor weights (Culture, Values, History, Ownership, Team, winning),
// plus tags. Facts show once everyone has answered.
const Q = [
 {id:'day', q:'Picture your first match. Where are you?', opts:[
   {t:'A giant stadium, 75,000 people, world-famous players', fx:{w:{H:1, P:1}, big:1}},
   {t:'In a wall of fans who sing for the whole 90 minutes', fx:{w:{C:2}}},
   {t:'A small neighbourhood ground where everyone knows each other', fx:{under:1, lower:1.5, home:.5}},
   {t:'A relaxed family day out with good food', fx:{w:{V:1}, us:1, women:.5}}],
  fact:"Borussia Dortmund's south stand, the Yellow Wall, holds about 25,000 standing fans. It is the biggest standing terrace in European football."},
 {id:'story', q:'Which story would you rather be part of?', opts:[
   {t:'A dynasty that wins trophies year after year', fx:{w:{P:2}, big:1}},
   {t:'A miracle: the underdog beats the giants', fx:{under:2}},
   {t:'A club that collapsed and its own fans rebuilt it', fx:{w:{O:2, C:1}}},
   {t:'A brand-new club writing its first chapter', fx:{young:2, us:.5}}],
  fact:'Leicester City won the 2015-16 Premier League. Bookmakers had them at 5,000 to 1 before the season started.'},
 {id:'win', q:'Your team loses more than it wins this year. How do you feel?', opts:[
   {t:"I still love them. That's what being a fan is", fx:{w:{P:-.5, C:.5}}},
   {t:'A bit sad, but I stick around', fx:{w:{P:.5}}},
   {t:'Frustrated. I want to see us win', fx:{w:{P:1.5}}},
   {t:"Honestly, I'd probably drift to another team", fx:{w:{P:2.5}, big:1}}],
  fact:'Fans who pick a team because it is winning right now get teased as "glory hunters." Most fans stick with a club for life, through relegations and all.'},
 {id:'own', q:'Who should own a football club?', opts:[
   {t:'The fans themselves, as members with a vote', fx:{w:{O:2.5}}},
   {t:'A local family or businessperson who cares about the town', fx:{w:{O:1.2}, home:.3}},
   {t:'A billionaire who spends big to win', fx:{w:{O:-1, P:1}}},
   {t:"I don't mind, as long as it's run well", fx:{}}],
  fact:'In Germany the "50+1 rule" gives members a majority of the votes at most clubs. A season ticket at Dortmund costs a fraction of one at Liverpool.'},
 {id:'wash', q:'A club gets bought by a foreign government trying to improve its image. You:', opts:[
   {t:"Walk away. That's not a club I'd back", fx:{w:{V:1.5}, sens:1.2}},
   {t:"Feel uneasy, but it wouldn't be a deal-breaker", fx:{w:{V:.6}, sens:.7}},
   {t:"Don't care if the team is good", fx:{sens:.25, w:{P:.5}}}],
  fact:'Manchester City is owned by a member of Abu Dhabi\'s ruling family, and Newcastle United by Saudi Arabia\'s sovereign wealth fund. Critics call it "sportswashing."'},
 {id:'cause', q:'Some clubs stand for something off the pitch: welcoming refugees, fighting racism, big community programmes. That is:', opts:[
   {t:'A big reason to pick a club', fx:{w:{V:2}}},
   {t:'Nice to have', fx:{w:{V:.7}}},
   {t:'Not why I watch sport', fx:{w:{V:-.3}}}],
  fact:"Hamburg's St. Pauli flies a skull-and-crossbones flag and is known worldwide for anti-racist fan culture. Its fans voted to turn the club into a member-owned co-operative in 2024."},
 {id:'old', q:'How old should your club be?', opts:[
   {t:'Ancient. I want 140 years of stories', fx:{w:{H:2}}},
   {t:'Some history is nice, not essential', fx:{w:{H:.7}}},
   {t:'New is exciting. Be there from the start', fx:{young:2, w:{H:-.5}}}],
  fact:'Notts County, founded in 1862, is the oldest professional club in the world. Sacramento Republic FC was founded in 2012 and won its league in its very first season.'},
 {id:'where', multi:true, q:'Where would you most like to go to a match? Pick any.', opts:[
   {t:'England', v:'England'}, {t:'Germany', v:'Germany'}, {t:'Spain', v:'Spain'}, {t:'Italy', v:'Italy'},
   {t:'France', v:'France'}, {t:'Somewhere unusual (Norway, Türkiye, Portugal…)', v:'other'},
   {t:'A US road trip', v:'USA'}, {t:'Close to home (California and the West Coast)', v:'home'}],
  fact:"Norway's Bodø/Glimt plays north of the Arctic Circle, on artificial grass, and knocked Roma out of Europe with a 6-1 win in 2021."},
 {id:'when', q:'When would you actually watch?', opts:[
   {t:'Weekend mornings with coffee or pancakes', fx:{eu:1}},
   {t:'Evenings after school or work', fx:{us:1.2}},
   {t:'Whenever it fits', fx:{}}],
  fact:'A 3pm Saturday kickoff in England is 7am in Sacramento. In the UK those 3pm matches are not shown on TV at all, so fans go to the ground instead.'},
 {id:'style', q:'What kind of team do you want to watch?', opts:[
   {t:'Beautiful passing, like a dance', fx:{w:{S:1.5}, big:.3}},
   {t:'All-out energy: chase every ball', fx:{w:{S:1, C:.5}}},
   {t:'Scrappy fighters who never give up', fx:{w:{S:.5}, under:1}},
   {t:'Superstars who can win it alone', fx:{big:1.2, w:{P:.8}}}],
  fact:'Jürgen Klopp called his style "heavy metal football": win the ball back within seconds of losing it. He coached both Dortmund and Liverpool, which is part of why those two clubs have a friendship.'},
 {id:'colour', q:'Pick a colour to wear on match day.', opts:[
   {t:'Red', v:'red'}, {t:'Royal blue', v:'blue'}, {t:'Sky blue', v:'sky'}, {t:'Yellow', v:'yellow'},
   {t:'Green', v:'green'}, {t:'Purple', v:'purple'}, {t:'Orange', v:'orange'}, {t:'Black and white', v:'bw'}],
  fact:"Juventus plays in black and white stripes because in 1903 a friend in England shipped them Notts County's shirts. They never changed back."},
 {id:'women', q:"Would you like a women's team to follow too?", opts:[
   {t:'Yes, I want one of my clubs to be a women\'s team', fx:{women:2}},
   {t:'Maybe, if the club has both', fx:{women:.5}},
   {t:'Not right now', fx:{women:-1.5}}],
  fact:"The US women's team has won four World Cups (1991, 1999, 2015, 2019). The NWSL is the top women's league in the country, and the Portland Thorns have won it three times."},
 {id:'stars', multi:true, q:'Which of these players have you heard of? Pick any.', opts:[
   {t:'Lionel Messi', v:'messi'}, {t:'Cristiano Ronaldo', v:'ronaldo'}, {t:'Kylian Mbappé', v:'mbappe'}, {t:'Erling Haaland', v:'haaland'},
   {t:'Mohamed Salah', v:'salah'}, {t:'Harry Kane', v:'kane'}, {t:'Son Heung-min', v:'son'}, {t:'Christian Pulisic', v:'pulisic'},
   {t:'David Beckham', v:'beckham'}, {t:'Alex Morgan', v:'morgan'}, {t:'None of them', v:'none'}],
  fact:'Messi joined Inter Miami in 2023 and won the Leagues Cup within five weeks. David Beckham is one of the club\'s owners.'},
 {id:'song', q:"Before kickoff, 50,000 people sing the same song, scarves held high. That gives you:", opts:[
   {t:'Goosebumps. Sign me up', fx:{w:{C:2}}},
   {t:"It's pretty cool", fx:{w:{C:.8}}},
   {t:'Mostly I want the game to start', fx:{w:{S:.5, P:.3}}}],
  fact:'Liverpool fans sing "You\'ll Never Walk Alone" before every home match. The song comes from a 1945 Broadway musical, Carousel. Dortmund fans sing it too.'},
 {id:'trouble', q:'Clubs sometimes get in trouble: racist chants, cheating on spending rules, violent fans. How much should that count against a club?', opts:[
   {t:'A lot. I want a club I can be proud of', fx:{sens:1.2, w:{V:.8}}},
   {t:'Some, depending on what happened', fx:{sens:.7}},
   {t:'Not much. Every big club has something', fx:{sens:.3}}],
  fact:'Union Berlin fans rebuilt their own stadium in 2008 and 2009, putting in about 140,000 volunteer hours. Some even donated blood to raise money for the club.'},
 {id:'family', q:'Kevin follows Liverpool, Borussia Dortmund, the Portland Timbers and Thorns, and Sacramento Republic. Would you like to share a club with him?', opts:[
   {t:"Yes, I'd like at least one in common", fx:{family:2}},
   {t:'Maybe, if it fits', fx:{family:.8}},
   {t:"No, I'll find my own", fx:{family:-.5}},
   {t:"I'm Kevin", fx:{family:0}}],
  fact:'Portland Timbers fans have a lumberjack, Timber Joey. Every time the Timbers score, he cuts a slice off a log with a chainsaw and gives it to the goal scorer.'},
];

const PERSONAS = {C:['The Terrace Singer', 'You want noise, songs and a crowd that never sits down.'], V:['The Idealist', 'You want a club you can be proud of off the pitch too.'],
  H:['The Historian', 'Old grounds, old rivalries, a century of stories.'], O:['The Co-owner', 'You like clubs that belong to their fans.'],
  S:['The Tactician', 'You care how the team plays, and how hard it tries.'], P:['The Trophy Hunter', 'You want to celebrate. Often.'],
  under:['The Underdog Romantic', 'You root for the small club that punches above its weight.'], young:['The Founder', 'You want to be there from chapter one.'],
  home:['The Local', 'Your club should be a drive away.']};

// ---------------------------------------------------------------- state
const LS = 'family-club-draft';
let S = load() || {stage:'start', players:[], q:0, ans:{}, tab:0};
function load() { try { return JSON.parse(localStorage.getItem(LS)); } catch (e) { return null; } }
function keep() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} }
let db = null, past = [];

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;'}[c]));
const slug = s => s.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'player';
const $ = s => document.querySelector(s);

// ---------------------------------------------------------------- scoring
function profile(a) {
  const p = {w:{C:1, V:1, H:1, O:.5, S:.6, P:1}, big:0, under:0, young:0, sens:.6, lower:-1, home:0, us:0, eu:0, women:0, family:0, where:[], hue:null, stars:[]};
  let sens = [];
  for (const q of Q) {
    const v = a[q.id];
    if (v == null) continue;
    if (q.id === 'where') { p.where = v; continue; }
    if (q.id === 'colour') { p.hue = (q.opts[v] || {}).v || null; continue; }
    if (q.id === 'stars') { p.stars = v.filter(x => x !== 'none'); continue; }
    const fx = q.opts[v].fx || {};
    for (const [f, d] of Object.entries(fx.w || {})) p.w[f] = Math.max(0.1, p.w[f] + d);
    for (const t of ['big', 'under', 'young', 'lower', 'home', 'us', 'eu', 'women', 'family']) if (fx[t]) p[t] += fx[t];
    if (fx.sens != null) sens.push(fx.sens);
  }
  if (sens.length) p.sens = sens.reduce((s, x) => s + x, 0) / sens.length;
  return p;
}
function hsl(hex) {
  const n = parseInt(hex.slice(1), 16), r = (n >> 16) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn;
  if (!d) return [0, 0, l];
  const s = d / (1 - Math.abs(2 * l - 1));
  let h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return [(h * 60 + 360) % 360, s, l];
}
const EUROPE = ['England', 'Germany', 'Spain', 'Italy', 'France'];
function scoreClub(c, p) {
  const f = {C:c.C / 10, V:c.V / 10, H:c.H / 10, O:c.O / 10, S:c.S / 10, P:c.P / 10};
  const W = Object.values(p.w).reduce((s, x) => s + x, 0);
  let base = 0; const parts = {};
  for (const k of Object.keys(p.w)) { parts[k] = p.w[k] * f[k] / W * 100; base += parts[k]; }
  const why = [];
  const add = (x, label) => { if (x) { bonus += x; if (label && x >= 2) why.push(label); } };
  let bonus = 0;
  bonus += p.sens * c.adj * .8;
  const isBig = c.H >= 9 && c.P >= 6, us = c.co === 'USA' || c.co === 'Canada';
  add(p.big * (isBig ? 5 : 0), 'A giant of the game');
  add(p.under * (!isBig && c.P < 5.5 ? 4 : 0), 'An underdog');
  add(p.young * (c.H <= 3 ? 5 : c.H >= 8 ? -2 : 0), 'A young club');
  if (['ch', 'cup', 'usl'].includes(c.k)) add(p.lower * 3, 'A true neighbourhood club');
  if (p.where.length) {
    const hit = p.where.includes(c.co) || (p.where.includes('other') && !EUROPE.includes(c.co) && !us) || (p.where.includes('home') && c.mi != null);
    add(hit ? 8 : -3, p.where.includes('home') && c.mi != null ? (c.mi ? `${c.mi} miles from Sacramento` : 'In Sacramento') : 'Somewhere you want to go');
  }
  if (c.mi != null) add(p.home * (c.mi <= 150 ? 8 : c.mi <= 750 ? 4 : 0), c.mi <= 150 ? 'Close to home' : null);
  add(us ? p.us * 3 : 0, 'Easy to watch in the evening');
  add(!us ? p.eu * 2.5 : 0, 'Weekend-morning football');
  if (c.k === 'nwsl') add(p.women * 5, "A women's team");
  if (KEVIN.includes(c.n)) add(p.family * 5, "One of Kevin's clubs");
  for (const s of p.stars) { const st = STARS[s]; if (!st) continue; if (st.cur.includes(c.n)) add(5, `${STAR_NAME[s]} plays here`); else if (st.old.includes(c.n)) add(2, `${STAR_NAME[s]} played here`); }
  if (p.hue) {
    const [h, s, l] = hsl(c.col), [th, ts] = HUES[p.hue];
    let hit = false;
    if (!ts) hit = s < .18 || l < .12 || l > .9; else { const dh = Math.min(Math.abs(h - th), 360 - Math.abs(h - th)); hit = s >= .25 && l > .12 && l < .9 && dh < (p.hue === 'red' || p.hue === 'orange' ? 16 : 28); }
    add(hit ? 4 : 0, 'Wears your colour');
  }
  // ranked on the uncapped score; shown out of 99
  const total = Math.max(0, base + bonus * .7);
  const top = Object.entries(parts).filter(([k]) => f[k] >= .75).sort((a, b) => b[1] - a[1]).slice(0, 2);
  const LBL = {C:'Famous atmosphere', V:'A club with values', H:'Deep history', O:'Fans have a real say', S:'Plays with heart', P:'Wins a lot lately'};
  return {c, total, why:[...why, ...top.map(([k]) => LBL[k])].slice(0, 4)};
}
function rank(a) { const p = profile(a); return {p, list:CLUBS.map(c => scoreClub(c, p)).sort((x, y) => y.total - x.total)}; }
function persona(p) {
  const W = Object.values(p.w).reduce((s, x) => s + x, 0), rel = {};
  const avg = {C:1, V:1, H:1, O:.5, S:.6, P:1};
  for (const k in p.w) rel[k] = p.w[k] / W - avg[k] / 4.1;
  rel.under = p.under * .05; rel.young = p.young * .05; rel.home = (p.home + (p.where.includes('home') ? 1 : 0)) * .04;
  return PERSONAS[Object.entries(rel).sort((a, b) => b[1] - a[1])[0][0]];
}

// ---------------------------------------------------------------- views
function render() {
  keep();
  const el = $('#app');
  if (S.stage === 'start') el.innerHTML = viewStart();
  else if (S.stage === 'q') el.innerHTML = viewQ();
  else el.innerHTML = viewResults();
  const f = document.querySelector('[data-focus]'); if (f) f.focus();
}
function viewStart() {
  const ps = S.players.length ? S.players : [];
  return `<div class="stack">
  <section class="hero">
    <div class="scarf" style="--c1:var(--pitch);--c2:var(--flood)"></div>
    <p class="eyebrow">A game for the whole family</p>
    <h1>Family Club Draft</h1>
    <p>Sixteen quick questions about what you'd enjoy, no football knowledge needed. Each one comes with a short story from the game. At the end, everyone gets a club (or five) that fits them, out of ${CLUBS.length} clubs in England, Europe and the US.</p>
    <p class="muted">Play alone, or add everyone and answer together on one phone: each person taps their own name on the answer they pick.</p>
  </section>
  <section class="card stack">
    <h3>Who's playing?</h3>
    <div class="players">${ps.map((p, i) => `<div class="pl"><span class="dot" style="--pc:${p.col}"></span><input id="pn-${i}" value="${esc(p.name)}" aria-label="Player ${i + 1} name" data-pn="${i}"><button class="x" data-del="${i}" aria-label="Remove ${esc(p.name)}">×</button></div>`).join('')}
      <div class="pl"><span class="dot" style="--pc:${PCOL[ps.length % PCOL.length]}"></span><input id="pn-new" placeholder="Add a name" aria-label="Add a player"${ps.length ? '' : ' data-focus'}><button class="btn small" data-add>Add</button></div></div>
    <div class="row"><button class="btn go" data-start ${ps.length ? '' : 'disabled'}>Kick off</button>${S.q || Object.keys(S.ans).length ? '<button class="btn small" data-reset>Start over</button>' : ''}</div>
  </section>
  ${past.length ? `<section class="stack"><h3>Past drafts</h3><div class="past">${past.map((r, i) => `<button class="li" data-past="${i}" style="--cc:${r.col || 'var(--pitch)'}"><i></i><div><strong>${esc(r.name)}</strong><span class="meta">${esc((r.top || []).slice(0, 3).join(' · '))}</span></div><span class="meta">${r.at ? new Date(r.at).toLocaleDateString() : ''}</span></button>`).join('')}</div></section>` : ''}
  </div>`;
}
function answeredAll(q) { return S.players.every((_, i) => { const v = (S.ans[i] || {})[q.id]; return q.multi ? Array.isArray(v) && v.length : v != null; }); }
function viewQ() {
  const q = Q[S.q], multi = !!q.multi, solo = S.players.length === 1, done = answeredAll(q);
  const picked = (i, o) => { const v = (S.ans[i] || {})[q.id]; return multi ? Array.isArray(v) && v.includes(q.opts[o].v) : v === o; };
  const opts = q.opts.map((o, oi) => {
    const sel = S.players.some((_, i) => picked(i, oi));
    return solo ? `<button class="opt ${picked(0, oi) ? 'sel' : ''}" data-pick="0:${oi}" aria-pressed="${picked(0, oi)}"><b>${esc(o.t)}</b></button>`
      : `<div class="opt ${sel ? 'sel' : ''}"><b>${esc(o.t)}</b><div class="who">${S.players.map((p, i) => `<button style="--pc:${p.col}" data-pick="${i}:${oi}" aria-pressed="${picked(i, oi)}">${esc(p.name)}</button>`).join('')}</div></div>`;
  }).join('');
  const left = S.players.filter((_, i) => { const v = (S.ans[i] || {})[q.id]; return multi ? !(Array.isArray(v) && v.length) : v == null; }).map(p => p.name);
  return `<div class="stack">
    <div class="prog" aria-label="Question ${S.q + 1} of ${Q.length}">${Q.map((_, i) => `<i class="${i <= S.q ? 'on' : ''}"></i>`).join('')}</div>
    <p class="eyebrow">Question ${S.q + 1} of ${Q.length}${multi ? ' · pick as many as you like' : ''}</p>
    <h2>${esc(q.q)}</h2>
    <div class="opts">${opts}</div>
    ${done ? `<div class="fact"><span class="eyebrow">Did you know?</span><p>${esc(q.fact)}</p></div>` : `<p class="waiting">${solo ? '' : 'Still to answer: ' + left.map(esc).join(', ')}</p>`}
    <div class="nav"><button class="btn small" data-back>${S.q ? 'Back' : 'Players'}</button><button class="btn go" data-next ${done ? '' : 'disabled'}>${S.q === Q.length - 1 ? 'See my clubs' : 'Next'}</button></div>
  </div>`;
}
function viewResults() {
  const res = S.players.map((p, i) => Object.assign({pl:p, i}, rank(S.ans[i] || {})));
  const tab = S.tab ?? 0, fam = S.players.length > 1;
  const tabs = `<div class="tabs">${res.map(r => `<button style="--pc:${r.pl.col}" data-tab="${r.i}" aria-pressed="${tab === r.i}">${esc(r.pl.name)}</button>`).join('')}${fam ? `<button data-tab="-1" aria-pressed="${tab === -1}">Family</button>` : ''}</div>`;
  let body = '';
  if (tab === -1) body = viewFamily(res);
  else {
    const r = res[tab] || res[0], [pn, pd] = persona(r.p), top = r.list[0], rest = r.list.slice(1, 5);
    const topCo = new Set(r.list.slice(0, 5).map(x => x.c.co));
    const wild = r.list.find(x => !topCo.has(x.c.co));
    body = `<section class="stack"><p class="eyebrow">${esc(r.pl.name)}'s football personality</p><p class="persona">${esc(pn)}</p><p>${esc(pd)}</p></section>
    ${clubCard(top, 'Your club')}
    <section class="stack"><h3>Also a great fit</h3><div class="list">${rest.map(x => row(x)).join('')}</div></section>
    ${wild ? `<section class="stack"><h3>Wildcard</h3><p class="muted">The best match outside the countries above.</p><div class="list">${row(wild)}</div></section>` : ''}
    <details class="card"><summary>How the matching works</summary><p>Every club has five ratings out of 10 (fan culture, values, history, ownership, team) plus a track record of recent results. Your answers decide how much each one matters to you. Places you'd like to go, your colour, players you know, women's teams and sharing a club with Kevin add a few points. Bad behaviour (racism, violent fans, cheating on spending) takes points off, more if you said it matters.</p></details>`;
  }
  return `<div class="stack">
    <div class="scarf" style="--c1:var(--pitch);--c2:var(--flood)"></div>
    <h1>Your clubs</h1>${tabs}${body}
    <div class="row"><button class="btn small" data-back>Change answers</button><button class="btn small" data-reset>New draft</button><span class="note" id="saved">${S.saved ? 'Saved.' : ''}</span></div>
  </div>`;
}
function clubCard(x, label) {
  const c = x.c;
  return `<article class="card top" style="--cc:${c.col}">
    <div class="scarf"></div>
    <p class="eyebrow">${esc(label)}</p>
    <div class="row" style="justify-content:space-between;align-items:flex-end"><span class="big">${esc(c.n)}</span><span class="score">${Math.min(99, Math.round(x.total))}</span></div>
    <p class="meta">${esc(c.lg)} · ${esc(c.co)}</p>
    ${x.why.length ? `<div class="chips">${x.why.map(w => `<span>${esc(w)}</span>`).join('')}</div>` : ''}
    ${c.hist ? `<p class="story"><b>The story</b>${esc(c.hist)}</p>` : ''}
    ${c.cult ? `<p class="story"><b>The fans</b>${esc(c.cult)}</p>` : ''}
  </article>`;
}
function row(x) {
  const c = x.c;
  return `<button class="li" data-club="${esc(c.n)}" style="--cc:${c.col}" aria-expanded="${S.open === c.n}"><i></i><div><strong>${esc(c.n)}</strong><span class="meta">${esc(c.lg)} · ${esc(c.co)}${x.why.length ? ' · ' + esc(x.why.slice(0, 2).join(', ')) : ''}</span>${S.open === c.n ? `<span class="story" style="display:block;margin-top:8px">${esc(c.hist)}</span><span class="story muted" style="display:block;margin-top:6px">${esc(c.cult)}</span>` : ''}</div><span class="score">${Math.min(99, Math.round(x.total))}</span></button>`;
}
function viewFamily(res) {
  // A club everyone could back: best average score across the family.
  const avg = CLUBS.map((c, ci) => ({c, total:res.reduce((s, r) => s + r.list.find(x => x.c === c).total, 0) / res.length, why:[]})).sort((a, b) => b.total - a.total);
  const tops = res.map(r => new Set(r.list.slice(0, 10).map(x => x.c.n)));
  const shared = CLUBS.filter(c => tops.filter(t => t.has(c.n)).length >= 2).map(c => ({c, who:res.filter((r, i) => tops[i].has(c.n)).map(r => r.pl.name)}));
  return `<section class="fam">${res.map(r => `<div class="card" style="--pc:${r.pl.col}"><p class="eyebrow">${esc(r.pl.name)}</p><h3>${esc(r.list[0].c.n)}</h3><p class="meta">${esc(persona(r.p)[0])}</p></div>`).join('')}</section>
    ${clubCard(avg[0], 'A club you could all back')}
    <section class="stack"><h3>In more than one top 10</h3>${shared.length ? `<div class="list">${shared.map(s => `<button class="li" data-club="${esc(s.c.n)}" style="--cc:${s.c.col}"><i></i><div><strong>${esc(s.c.n)}</strong><span class="meta">${esc(s.who.join(', '))}</span></div><span class="meta">${esc(s.c.co)}</span></button>`).join('')}</div>` : '<p class="muted">No overlap in anyone\'s top 10. A house divided!</p>'}</section>`;
}

// ---------------------------------------------------------------- actions
function addPlayer() {
  const el = $('#pn-new'), n = el && el.value.trim();
  if (!n) return;
  S.players.push({name:n, col:PCOL[S.players.length % PCOL.length]}); render();
  const nx = $('#pn-new'); if (nx) nx.focus();
}
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'pn-new') { e.preventDefault(); addPlayer(); } });
document.addEventListener('change', e => { const i = e.target.dataset.pn; if (i != null) { const v = e.target.value.trim(); if (v) S.players[+i].name = v; keep(); } });
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  const d = t.dataset;
  if ('add' in d) return addPlayer();
  if (d.del != null) { S.players.splice(+d.del, 1); const a = {}; S.players.forEach((_, i) => a[i] = S.ans[i >= +d.del ? i + 1 : i]); S.ans = a; return render(); }
  if ('start' in d) { const pending = $('#pn-new'); if (pending && pending.value.trim()) addPlayer(); if (!S.players.length) return; S.stage = 'q'; S.saved = false; window.scrollTo(0, 0); return render(); }
  if ('reset' in d) { S = {stage:'start', players:S.players, q:0, ans:{}, tab:0}; return render(); }
  if (d.pick) {
    const [pi, oi] = d.pick.split(':').map(Number), q = Q[S.q], a = S.ans[pi] = S.ans[pi] || {};
    if (q.multi) {
      const v = q.opts[oi].v; let cur = Array.isArray(a[q.id]) ? a[q.id] : [];
      cur = cur.includes(v) ? cur.filter(x => x !== v) : v === 'none' ? ['none'] : [...cur.filter(x => x !== 'none'), v];
      a[q.id] = cur;
    } else a[q.id] = oi;
    return render();
  }
  if ('next' in d) { if (S.q < Q.length - 1) { S.q++; window.scrollTo(0, 0); return render(); } S.stage = 'r'; S.tab = 0; window.scrollTo(0, 0); render(); return saveAll(); }
  if ('back' in d) { if (S.stage === 'r') { S.stage = 'q'; S.q = Q.length - 1; } else if (S.q) S.q--; else S.stage = 'start'; return render(); }
  if (d.tab != null) { S.tab = +d.tab; S.open = null; return render(); }
  if (d.club) { S.open = S.open === d.club ? null : d.club; return render(); }
  if (d.past != null) { const r = past[+d.past]; if (!r || !r.answers) return; S = {stage:'r', players:[{name:r.name, col:r.col || PCOL[0]}], ans:{0:r.answers}, q:Q.length - 1, tab:0, saved:true}; window.scrollTo(0, 0); return render(); }
});

// ---------------------------------------------------------------- saving (claude.ai db when available; this device otherwise)
async function saveAll() {
  if (!db) return;
  try {
    for (const [i, p] of S.players.entries()) {
      const r = rank(S.ans[i] || {});
      await db.collection('drafts').doc(slug(p.name) + '-' + Date.now()).set({name:p.name, col:p.col, answers:S.ans[i] || {}, top:r.list.slice(0, 5).map(x => x.c.n), persona:persona(r.p)[0], at:Date.now()});
    }
    S.saved = true; keep(); const el = $('#saved'); if (el) el.textContent = 'Saved.';
  } catch (e) { const el = $('#saved'); if (el) el.textContent = 'Saved on this device only.'; }
}
render();
(async () => {
  try {
    db = window.claude && await window.claude.use('db');
    if (!db) return;
    db.collection('drafts').orderBy('at', 'desc').limit(30).onSnapshot(snap => {
      past = snap.docs.map(d => d.data()).filter(Boolean);
      if (S.stage === 'start') render();
    }, () => {});
  } catch (e) {}
})();
</script>
