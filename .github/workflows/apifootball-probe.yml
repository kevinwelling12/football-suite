name: API-Football probe
# Run by hand: what does the API-Football plan cover for our 12 competitions? About 40 requests (free plan: 100 a day).
# Uses the repo secret APIFOOTBALL_KEY. Prints the summary and probe.json to the log and the run summary (no commit).
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: |
          [ -n "$APIFOOTBALL_KEY" ] || { echo "Repo secret APIFOOTBALL_KEY is not set"; exit 1; }
          node scripts/apifootball/probe.js | tee summary.txt
          echo "----- probe.json"
          cat scripts/apifootball/probe.json
          { echo '```'; cat summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe
          path: scripts/apifootball/probe.json
          if-no-files-found: ignore
