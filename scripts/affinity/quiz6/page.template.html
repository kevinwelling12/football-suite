<title>This or That</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#000;--card:#1C1C1E;--card2:#2C2C2E;--ink:#fff;--muted:rgba(235,235,245,.62);--faint:rgba(235,235,245,.32);--accent:#0A84FF;--a:#FF9F0A;--b:#64D2FF}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Archivo,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;padding-inline:16px;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding-block:20px 32px;display:flex;flex-direction:column;gap:18px;min-height:100%}
.top{display:flex;justify-content:space-between;align-items:baseline}
.brand{font-weight:900;font-size:26px;font-variation-settings:"wdth" 115;letter-spacing:-.01em}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.bar{height:4px;border-radius:2px;background:var(--card2);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.clock{height:3px;border-radius:2px;background:var(--card2);overflow:hidden}.clock i{display:block;height:100%;width:100%;background:var(--faint);transform-origin:left}
.kind{font-size:12px;text-transform:uppercase;letter-spacing:.1em;font-weight:800;color:var(--muted);text-align:center}
.pick{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:600px){.pick{grid-template-columns:1fr 1fr}}
.pick button{font:inherit;border:0;border-radius:18px;min-height:132px;padding:18px;font-size:22px;font-weight:800;line-height:1.2;text-wrap:balance;cursor:pointer;color:var(--ink);background:var(--card)}
.pick button.l{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--a) 55%,transparent)}.pick button.r{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--b) 55%,transparent)}
.pick button:active{transform:scale(.98)}
.pick button:focus-visible,.cta:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.or{text-align:center;color:var(--faint);font-weight:800;font-size:13px;letter-spacing:.1em}
@media (min-width:600px){.or{display:none}}
.hint{text-align:center;color:var(--faint);font-size:13px}
h1{margin:0;font-size:24px;line-height:1.25;text-wrap:balance}
.lead{margin:0;color:var(--muted)}
.cta{font:inherit;border:0;border-radius:14px;padding:16px;background:var(--accent);color:#fff;font-weight:800;font-size:18px;cursor:pointer}
.foot{margin-top:auto;display:flex;justify-content:space-between;color:var(--faint);font-size:13px}
.foot button{font:inherit;background:none;border:0;color:var(--muted);cursor:pointer;padding:6px 0}
@media (prefers-reduced-motion:reduce){.clock i{transition:none!important}}
</style>
<div class="wrap">
  <div class="top"><div class="brand">This or That</div><div class="count" id="count"></div></div>
  <div class="bar"><i id="fill" style="width:0%"></i></div>
  <main id="main" aria-live="polite" style="display:flex;flex-direction:column;gap:16px"></main>
  <div class="foot"><button id="back" type="button">← Back</button><span id="save"></span></div>
</div>
<script>
const Q = /*__QUESTIONS__*/;
const STORE = 'this-or-that-v1', $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
let st = {order: null, answers: {}, times: {}, idx: -1};
try { const j = JSON.parse(localStorage.getItem(STORE) || 'null'); if (j && j.order) st = j; } catch (e) {}
const byId = Object.fromEntries(Q.map(q => [q.id, q]));
let shown = Date.now(), ref = null, chain = Promise.resolve(), dirty = false, saved = '';
function newOrder() { const o = Q.map(q => ({id: q.id, flip: Math.random() < .5 ? 1 : 0})); for (let i = o.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [o[i], o[j]] = [o[j], o[i]]; } return o; }
function persist() {
  try { localStorage.setItem(STORE, JSON.stringify(st)); } catch (e) {}
  if (!ref) return; dirty = true;
  chain = chain.then(async () => { if (!dirty) return; dirty = false;
    try { await ref.set({answers: st.answers, times: st.times, order: st.order, idx: st.idx, done: Object.keys(st.answers).length === Q.length, updated: new Date().toISOString()}); saved = 'Saved'; } catch (e) { saved = 'Saved on this device'; }
    $('#save').textContent = saved; });
}
function pick(side) {
  const it = st.order[st.idx]; if (!it) return;
  st.answers[it.id] = it.flip ? (side === 'l' ? 'r' : 'l') : side; st.times[it.id] = Date.now() - shown;
  go(st.idx + 1);
}
function go(i) { st.idx = Math.max(0, Math.min(i, Q.length)); shown = Date.now(); persist(); render(); }
function render() {
  const n = Object.keys(st.answers).length;
  $('#fill').style.width = `${Math.round(n / Q.length * 100)}%`;
  $('#count').textContent = st.idx >= 0 && st.idx < Q.length ? `${st.idx + 1} / ${Q.length}` : '';
  $('#back').hidden = st.idx <= 0;
  const m = $('#main');
  if (st.idx < 0) {
    m.innerHTML = `<h1>90 quick picks. Gut only.</h1><p class="lead">Two options, tap one. Don't think; a bar drains to keep you moving, but nothing times out. Some are about football, some aren't. About four minutes.</p>
      <p class="lead">On a keyboard: ← left, → right.</p><button class="cta" id="go" type="button">${n ? 'Resume' : 'Start'}</button>`;
    $('#go').onclick = () => { if (!st.order) st.order = newOrder(); const k = st.order.findIndex(x => !(x.id in st.answers)); go(k < 0 ? Q.length : k); };
    return;
  }
  if (st.idx >= Q.length) {
    const miss = Q.length - n;
    m.innerHTML = `<h1>${miss ? `${miss} left` : 'Done. Thanks.'}</h1><p class="lead">${miss ? '' : 'Tell Claude you\'re finished.'}</p>${miss ? '<button class="cta" id="gap" type="button">Finish the rest</button>' : ''}`;
    if (miss) $('#gap').onclick = () => go(st.order.findIndex(x => !(x.id in st.answers)));
    return;
  }
  const it = st.order[st.idx], q = byId[it.id], [L, R] = it.flip ? [q.r, q.l] : [q.l, q.r];
  m.innerHTML = `<div class="kind">${q.club ? 'Which club?' : 'This or that'}</div><div class="clock"><i id="clock"></i></div>
    <div class="pick"><button class="l" type="button" data-s="l">${esc(L)}</button><div class="or">or</div><button class="r" type="button" data-s="r">${esc(R)}</button></div>`;
  m.querySelectorAll('[data-s]').forEach(b => b.onclick = () => pick(b.dataset.s));
  const c = $('#clock'); c.style.transition = 'none'; c.style.transform = 'scaleX(1)';
  requestAnimationFrame(() => requestAnimationFrame(() => { c.style.transition = 'transform 3s linear'; c.style.transform = 'scaleX(0)'; }));
}
addEventListener('keydown', e => { if (st.idx < 0 || st.idx >= Q.length) return; if (e.key === 'ArrowLeft') pick('l'); if (e.key === 'ArrowRight') pick('r'); });
$('#back').onclick = () => go(st.idx - 1);
render();
(async () => { try {
  const db = window.claude && await window.claude.use('db'); if (!db) return;
  ref = db.doc('responses/kevin'); const s = await ref.get(), r = s.exists ? s.data() : null;
  if (r && r.order && Object.keys(r.answers || {}).length > Object.keys(st.answers).length) { st = {order: r.order, answers: {...r.answers}, times: {...(r.times || {})}, idx: r.idx ?? -1}; render(); }
  else if (Object.keys(st.answers).length) persist();
} catch (e) {} })();
</script>
