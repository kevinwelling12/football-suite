<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Football Tracker Suite</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap" rel="stylesheet">
<style>
:root{
  --head:#37003C; --accent:#E90052; --glow:rgba(233,0,82,.55); --tag:#FF6FA6;
  --page:#F4F2F7; --card:#FFFFFF; --ink:#22052D; --muted:#6E6478; --faint:#A79FB0; --line:#E7E2EE;
  --plum:#37003C; --plum-2:#4B0A52; --magenta:#E90052; --mint:#00A85A; --mint-soft:#DDF7E9; --cyan:#0A9DB0;
  --amber:#F29D0C; --rose:#FCE4EC; --gold-soft:#FFF1C9; --green-soft:#E3F6EA; --mint-zone:#F1FAF4; --rose-zone:#FDEBF1;
  --hbar:#37003C; --dbar:#B8AEC3; --abar:#0A9DB0;
  --shadow:0 1px 0 rgba(34,5,45,.04), 0 6px 18px -12px rgba(34,5,45,.25);
  --r-lg:18px; --r-md:12px; --r-sm:8px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#140318; --card:#1E0724; --ink:#F4ECF7; --muted:#B7A9C2; --faint:#7F7089; --line:#33193A;
    --plum:#2A002F; --plum-2:#3A0A41; --magenta:#FF3D7F; --mint:#2BD68A; --mint-soft:#0F3A27; --cyan:#35C7DA;
    --amber:#FFB13B; --rose:#3A1426; --gold-soft:#3B3014; --green-soft:#12301F; --mint-zone:#162A1E; --rose-zone:#361423;
    --hbar:#C9A4E0; --dbar:#6E5D79; --abar:#35C7DA; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#140318; --card:#1E0724; --ink:#F4ECF7; --muted:#B7A9C2; --faint:#7F7089; --line:#33193A;
  --plum:#2A002F; --plum-2:#3A0A41; --magenta:#FF3D7F; --mint:#2BD68A; --mint-soft:#0F3A27; --cyan:#35C7DA;
  --amber:#FFB13B; --rose:#3A1426; --gold-soft:#3B3014; --green-soft:#12301F; --mint-zone:#162A1E; --rose-zone:#361423;
  --hbar:#C9A4E0; --dbar:#6E5D79; --abar:#35C7DA; --shadow:none; color-scheme:dark;
}
*{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--page);color:var(--ink)}
body{font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variation-settings:"wdth" 100;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--magenta);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}

/* ---------- masthead ---------- */
.mast{background:var(--head);transition:background .25s;color:#fff;padding:22px 20px 0;position:relative;overflow:hidden}
.mast::after{content:"";position:absolute;right:-60px;top:-80px;width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%, var(--glow), transparent 62%);pointer-events:none}
.mast-in{max-width:1080px;margin:0 auto;position:relative;z-index:1}
.league{font-variation-settings:"wdth" 125;font-weight:850;font-size:clamp(26px,5.4vw,42px);letter-spacing:-.01em;line-height:1;margin:0}
.season{font-variation-settings:"wdth" 62;font-weight:800;color:var(--tag);margin-left:.2em}
.status{margin:10px 0 18px;color:rgba(255,255,255,.72);font-size:14px}
.status b{color:#fff;font-weight:650}
.save-state{font-size:12px;color:rgba(255,255,255,.6);margin-left:6px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 16px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;color:rgba(255,255,255,.7);padding:12px 14px 14px;font-weight:650;font-size:15px;cursor:pointer;
  border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:#fff;border-bottom-color:var(--accent)}
main{max-width:1080px;margin:0 auto;padding:22px 16px 60px}
h2{font-variation-settings:"wdth" 112;font-weight:800;font-size:22px;margin:0;letter-spacing:-.005em}
.sub{color:var(--muted);font-size:14px;margin:4px 0 0}
.section{margin-top:30px}
.section:first-child{margin-top:0}

/* ---------- matchweek ---------- */
.mw-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.mw-nav{display:flex;align-items:center;gap:6px}
.mw-nav button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:18px;display:grid;place-items:center}
.mw-nav button:disabled{opacity:.35;cursor:default}
.mw-title{font-variation-settings:"wdth" 125;font-weight:850;font-size:30px;line-height:1}
.mw-dates{color:var(--muted);font-size:14px;margin-top:4px}
.slate{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 6px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px;color:var(--muted)}
.pill b{color:var(--ink);font-weight:750}
.matches{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;margin-top:14px}
.match{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px 12px;box-shadow:var(--shadow);position:relative}
.m-top{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);gap:8px}
.imp{display:flex;align-items:center;gap:6px}
.imp-track{width:54px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.imp-fill{display:block;height:100%;background:var(--amber);border-radius:3px}
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:10px 0 8px;cursor:pointer;border-radius:12px}
.team{font-weight:700;font-size:15.5px;line-height:1.2}
.team.h{text-align:right}
.team small{display:block;font-weight:500;color:var(--faint);font-size:12px}
.fav{color:var(--magenta)}
.score{white-space:nowrap;font-variation-settings:"wdth" 62;font-weight:850;font-size:46px;line-height:.9;letter-spacing:-.01em;min-width:106px;text-align:center;padding:4px 10px 6px;border-radius:12px;background:var(--page)}
.score .dash{color:var(--faint);font-weight:500;margin:0 .06em}
.score.final{background:var(--head);color:#fff}
.score.final .dash{color:rgba(255,255,255,.5)}
.score-cap{font-size:11px;color:var(--muted);text-align:center;margin-top:3px;font-variation-settings:"wdth" 100;font-weight:600;letter-spacing:.01em}
.probs{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;margin-top:4px}
.probs span:nth-child(1){background:var(--hbar)} .probs span:nth-child(2){background:var(--dbar)} .probs span:nth-child(3){background:var(--abar)}
.prob-lab{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:5px}
.m-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;color:var(--muted);gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:12.5px;font-weight:650;background:var(--page);color:var(--ink)}
.chip.fav{background:var(--rose);color:var(--magenta)}
.chip.hit{background:var(--mint-soft);color:var(--mint)}
.chip.miss{background:var(--page);color:var(--faint)}
.chip.p3{background:var(--mint);color:#fff}
.m-act{display:flex;justify-content:flex-end;margin-top:8px}
.enter{background:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:650;cursor:pointer;color:var(--ink)}
.enter:hover{border-color:var(--ink)}
.entry[hidden]{display:none}
.entry{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px}
.entry input{width:58px;height:44px;text-align:center;font-size:22px;font-weight:800;border:1px solid var(--line);border-radius:10px;background:var(--page)}
.entry .btn{height:40px;padding:0 16px;border-radius:999px;border:0;font-weight:700;cursor:pointer}
.btn.primary{background:var(--head);color:#fff}
.btn.ghost{background:var(--page);color:var(--ink)}

/* ---------- tables ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:12px;font-weight:650;color:var(--muted);text-align:center;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.club,th.club{text-align:left}
td.club{font-weight:650}
td.pos{position:relative;font-weight:700;width:40px}
td.pos::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:4px;border-radius:0 3px 3px 0;background:var(--zone,transparent)}
tr.cut td{border-bottom:2px solid var(--magenta)}
.mini{display:inline-flex;align-items:center;gap:6px;min-width:84px;justify-content:flex-end}
.mini i{display:block;height:6px;border-radius:3px;background:var(--cyan)}
.mini.bad i{background:var(--magenta)}
.status-tag{font-size:12px;font-weight:700;color:var(--mint)}
.status-tag.rel{color:var(--magenta)}

/* ---------- races ---------- */
.races{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-top:14px}
.race{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow)}
.race h3{margin:0 0 10px;font-variation-settings:"wdth" 112;font-size:17px;font-weight:800}
.bar-row{display:grid;grid-template-columns:120px 1fr 44px;align-items:center;gap:10px;padding:5px 0;font-size:14px}
.bar-row .t{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:10px;border-radius:5px;background:var(--page);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:var(--head)}
.race.bad .bar i{background:var(--magenta)}
.bar-row .v{text-align:right;font-weight:700}
.big{margin-top:14px}
.big-row{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.big-row:last-child{border-bottom:0}
.big-row .wk{font-size:12.5px;color:var(--muted);font-weight:650}
.big-row .mt{font-weight:700}
.big-row .mt small{display:block;color:var(--muted);font-weight:500;font-size:12.5px}

/* ---------- clubs ---------- */
.hai-row{display:grid;grid-template-columns:28px minmax(120px,190px) 1fr 56px;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);font-size:14px}
.hai-row:last-child{border-bottom:0}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--page)}
.stack .b{background:var(--plum)} .stack .x{background:var(--magenta)}
.hai-row .who{font-weight:700}
.hai-row .who small{display:block;font-weight:500;color:var(--muted);font-size:12px;white-space:normal}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}

/* ---------- settings ---------- */
.set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:14px}
.field{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px}
.field label{display:block;font-weight:700}
.field p{margin:4px 0 10px;color:var(--muted);font-size:13px}
.field input{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--page);font-weight:700}
.danger{background:none;border:1px solid var(--magenta);color:var(--magenta);border-radius:999px;padding:9px 16px;font-weight:700;cursor:pointer}

/* ---------- detail sheet ---------- */
dialog{border:0;padding:0;background:transparent;max-width:min(640px,96vw);width:100%}
dialog::backdrop{background:rgba(20,3,24,.55)}
.sheet{background:var(--card);border-radius:22px;padding:22px 20px 20px;max-height:88vh;overflow:auto}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.close{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--page);cursor:pointer;font-size:18px;flex:none}
.heat{display:grid;grid-template-columns:26px repeat(6,1fr);gap:3px;margin-top:10px;font-size:12px}
.heat div{aspect-ratio:1.5;display:grid;place-items:center;border-radius:6px;font-variant-numeric:tabular-nums}
.heat .ax{color:var(--muted);font-weight:700;aspect-ratio:auto}
.heat .c.pick{outline:3px solid var(--magenta);outline-offset:-3px;font-weight:800}
.heat .c.pred{box-shadow:inset 0 0 0 2px var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
@media (max-width:560px){.two{grid-template-columns:1fr}.score{font-size:40px;min-width:92px}.bar-row{grid-template-columns:96px 1fr 40px}}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv b{font-weight:750}
h4{margin:0 0 6px;font-size:14px;font-weight:800;font-variation-settings:"wdth" 112}
.note{color:var(--muted);font-size:13px;margin-top:16px}
.empty{padding:28px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.match{transition:border-color .15s}.match:hover{border-color:var(--faint)}}


.comps{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:14px -20px 0;padding:0 20px 2px}
.comps::-webkit-scrollbar{display:none}
.comps button{flex:none;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);color:#fff;border-radius:999px;padding:7px 13px 7px 10px;font-size:13.5px;font-weight:650;cursor:pointer;display:flex;align-items:center;gap:7px;white-space:nowrap}
.comps button i{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.comps button[aria-pressed="true"]{background:#fff;color:var(--ink);border-color:#fff}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;text-align:left;padding:0;display:block;width:100%}
.tile-top{background:var(--c);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tile-top b{font-variation-settings:"wdth" 118;font-weight:850;font-size:17px}
.tile-top span{font-size:12.5px;opacity:.8}
.tile-body{padding:12px 16px 14px;display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.tile-body .k{font-size:12px;color:var(--muted);font-weight:650}
.tile-body .v{font-weight:800;font-size:17px;line-height:1.2;font-variation-settings:"wdth" 100}
.tile-body .v small{display:block;font-size:12.5px;font-weight:500;color:var(--muted)}
.tile-next{grid-column:1/-1;border-top:1px dashed var(--line);padding-top:10px;font-size:13.5px;color:var(--muted)}
.tile-next b{color:var(--ink)}
.feed-row{display:grid;grid-template-columns:86px 110px 1fr 64px 70px;gap:10px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer}
.feed-row:last-child{border-bottom:0}
.feed-row .d{color:var(--muted);font-size:13px}
.feed-row .d.past{color:var(--faint);font-style:italic}
.feed-row .c{font-weight:750;color:var(--c);font-size:13px}
.feed-row .m{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feed-row .p{font-variation-settings:"wdth" 62;font-weight:850;font-size:20px;text-align:center}
@media (max-width:620px){.feed-row{grid-template-columns:70px 1fr 54px;}.feed-row .c{grid-column:1/-1;margin-bottom:-6px}.feed-row .imp{display:none}}
.grp{font-variation-settings:"wdth" 112;font-weight:800;font-size:15px;margin:18px 0 8px}
.loading{padding:30px;color:var(--muted)}
.draw-sel{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:8px;flex-wrap:wrap}
.draw-sel select{height:40px;border:1px solid var(--line);border-radius:10px;background:var(--page);padding:0 8px;max-width:150px}
.out-list{columns:2 220px;font-size:13.5px;color:var(--muted);padding:14px 16px}
.out-list div{break-inside:avoid;padding:2px 0}

.btn{height:40px;padding:0 16px;border-radius:999px;border:0;font-weight:700;cursor:pointer}

.race-note{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.4}
.race-note b{color:var(--ink);font-weight:700}
.race-done{font-size:14px;color:var(--muted);padding:6px 0}
.bar i{background:var(--accent)}
.race.bad .bar i{background:#E4572E}
.comps button[aria-pressed="true"]{color:#1E0A2B}
.stack .b{background:var(--accent)!important;opacity:.55}

@media (min-width:700px){.races.pairs{grid-template-columns:1fr 1fr}.races.pairs .race.solo{grid-column:1/-1}}

.race.bad .bar i{background:#E4572E}
.mini.bad i{background:#E4572E}

.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:999px;font-weight:700;font-size:13.5px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--head);color:#fff}
.club-link{background:none;border:0;padding:0;font:inherit;font-weight:inherit;color:inherit;cursor:pointer;text-align:left}
.club-link:hover{text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:3px}
.bar-row .t.club-link{font-weight:650}
.club-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:16px}
.club-stats>div{background:var(--page);border-radius:12px;padding:10px 12px}
.club-stats .k{font-size:12px;color:var(--muted);font-weight:650}.club-stats .v{font-weight:800;font-size:16px}
.form-row{margin-top:6px;font-size:13px;color:var(--muted);display:flex;gap:4px;align-items:center}
.form{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;font-size:11.5px;font-weight:800;color:#fff}
.form.fW{background:var(--mint)}.form.fD{background:#9A8FA6}.form.fL{background:#E4572E}
.cf-head,.cf-row{display:grid;grid-template-columns:96px 1fr 150px 56px 64px;gap:10px;align-items:center;font-size:13.5px}
.cf-head{color:var(--muted);font-size:12px;font-weight:650;padding:6px 0;border-bottom:1px solid var(--line)}
.cf-row{padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.cf-row .d{color:var(--muted)}.cf-row .o small{display:block;color:var(--muted);font-size:12px}
.cf-row .wdl .w{color:var(--mint);font-weight:700}.cf-row .wdl .dr{color:var(--muted)}.cf-row .wdl .l{color:#E4572E;font-weight:700}
.cf-row .pk{font-variation-settings:"wdth" 62;font-weight:850;font-size:18px;text-align:center}
@media (max-width:560px){.cf-head,.cf-row{grid-template-columns:62px 1fr 108px 44px}.cf-head span:last-child,.cf-row .imp{display:none}}

.cf-row .pk.o1{color:var(--mint)}.cf-row .pk.o-1{color:#E4572E}.cf-row .pk.o0{color:var(--muted)}

.nm-short{display:none}
@media (max-width:600px){
  main{padding:18px 12px 60px}
  .sm-hide{display:none}
  .nm-full{display:none}.nm-short{display:inline}
  th,td{padding:9px 4px;font-size:13px}
  th{font-size:11px}
  .mini{min-width:0;gap:0}.mini i{display:none}
  td.club .nm-short{display:inline-block;max-width:108px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
  td.pos{width:30px}
  .seg button{padding:6px 11px}
  .hai-row{grid-template-columns:24px 1fr 48px;grid-template-areas:"n w s" ". b b";row-gap:6px;padding:10px 12px}
  .hai-row>span:nth-child(1){grid-area:n}.hai-row .who{grid-area:w}.hai-row .stack{grid-area:b}.hai-row>span:nth-child(4){grid-area:s}
  .feed-row{grid-template-columns:1fr auto;grid-template-areas:"d p" "m p";row-gap:2px;padding:10px 14px}
  .feed-row .d{grid-area:d;font-size:12.5px}
  .feed-row .c{grid-area:d;justify-self:end;margin-right:10px}
  .feed-row .m{grid-area:m;white-space:normal}
  .feed-row .p{grid-area:p;align-self:center;font-size:22px}
  .feed-row .imp{display:none}
  .tile-body{grid-template-columns:1fr 1fr}
  .slate{gap:6px}.pill{padding:6px 11px;font-size:13px}
  .big-row{grid-template-columns:56px 1fr;padding:12px}

  .bar-row{grid-template-columns:92px 1fr 40px;gap:8px}
  .heat{gap:2px;font-size:10.5px}
  .sheet{padding:18px 14px 16px}
  .mw-title{font-size:26px}
}

// ---------------------------------------------------------------- playoffs bracket (NWSL, MLS)
function bracketState(k) {
  const r = R[k], done = r.rem.length === 0, kind = COMP[k].cfg.knockout, ko = state.ko[k] || {};
  const seedNum = {}, pts = {}; let seedOf;
  r.tab.forEach(t => { pts[t.i] = t.Pts; });
  const rank = t => done ? t.pos : t.projPos;
  if (kind === 'nwslpo') { const ov = [...r.tab].sort((a, b) => rank(a) - rank(b) || a.pos - b.pos).map(t => t.i); ov.forEach((t, i) => { seedNum[t] = i + 1; }); seedOf = s => ov[s.seed - 1]; }
  else { const byC = {}; for (const c of ['East', 'West']) { byC[c] = r.tab.filter(t => t.group === c).sort((a, b) => rank(a) - rank(b) || a.pos - b.pos).map(t => t.i); byC[c].forEach((t, i) => { seedNum[t] = i + 1; }); } seedOf = s => byC[s.conf][s.seed - 1]; }
  const P = MODEL.poProbs(r.att, r.def, r.homeRate, r.awayRate);
  const decide = (t, h, v) => {
    if (!done) return null;
    if (t.kind === 'bo3') { let wh = 0, wv = 0; for (let g = 1; g <= 3; g++) { const res = ko[`${t.id}-G${g}`]; if (!res) continue; let hw = MODEL.realWin(res); if (hw == null) continue; if (g === 2) hw = 1 - hw; if (hw) wh++; else wv++; } return wh >= 2 ? h : wv >= 2 ? v : null; }
    const res = ko[t.id]; if (!res) return null; const hw = MODEL.realWin(res); return hw == null ? null : hw ? h : v;
  };
  const ties = MODEL.poResolve(kind, seedOf, seedNum, pts, decide);
  for (const t of ties) {
    if (t.h == null || t.v == null || t.winner != null) continue;
    if (t.kind === 'bo3') {
      // exact series odds from the games still to play
      const gp = g => g === 2 ? 1 - P.pens(t.v, t.h) : P.pens(t.h, t.v);
      const rec = (g, wh, wv) => { if (wh >= 2) return 1; if (wv >= 2) return 0; const res = done ? ko[`${t.id}-G${g}`] : null;
        let hw = res ? MODEL.realWin(res) : null; if (hw != null && g === 2) hw = 1 - hw;
        if (hw != null) return rec(g + 1, wh + hw, wv + 1 - hw); const p = gp(g); return p * rec(g + 1, wh + 1, wv) + (1 - p) * rec(g + 1, wh, wv + 1); };
      t.pH = rec(1, 0, 0);
    } else t.pH = t.kind === 'pens' ? P.pens(t.h, t.v) : P.single(t.h, t.v, t.neutral);
  }

}

const PHRASE = {title:'winning the title', top4:'a top-4 finish', top3:'a top-3 finish', europe:'a top-6 finish', rel:'relegation', auto:'automatic promotion',

function zonePhrase(k, z) {

function narrative(k, f) {
  const r = R[k], cfg = COMP[k].cfg, p = x => pct(x);

  }

  const sideText = (side, i) => {

    const bits = zs.map((z, n) => {

  $('#sheet').innerHTML = `<div class="sheet-head"><div><div class="sub">${esc(COMPS_CFG[k].name)}${t.group ? ' · ' + (k === 'mls' ? esc(t.group) + 'ern Conference' : 'Group ' + esc(t.group)) : ''}</div>
      <h2 style="margin-top:4px">${tchip(k, i)}${esc(t.name)}</h2>
      <div class="club-meta">${form ? `<div class="form-row">Form ${form}</div>` : '<span></span>'}<button class="follow ${isFav(k, i) ? 'on' : ''}" ${t.color ? `style="--fc:${t.color}"` : ''} data-follow="${i}">${isFav(k, i) ? '★ Following' : '☆ Follow'}</button></div></div><button class="close" aria-label="Close" id="close">✕</button></div>
    ${stats}
    ${t.hai ? `<h4 style="margin-top:18px">Affinity ${(t.base + t.bonus).toFixed(1)}: why</h4><div class="hai-break">
      ${[['Supporter culture', 'C', 28], ['Values', 'V', 22], ['History & identity', 'H', 18], ['Ownership', 'O', 14], ['Style of play', 'S', 8]].map(([l, key, w]) => `<div class="hb"><span>${l} <small>${w}%</small></span><span class="bar"><i style="width:${t.hai[key] * 10}%"></i></span><b class="num">${t.hai[key]}/10</b></div>`).join('')}
      ${t.hai.adj ? `<div class="hb adj-row"><span>Adjustment</span><span>${esc(t.hai.note)}</span><b class="num">${t.hai.adj}</b></div>` : t.hai.note ? `<div class="hb"><span>Note</span><span style="font-size:12.5px;color:var(--muted)">${esc(t.hai.note)}</span><b></b></div>` : ''}
      ${t.bonus ? `<div class="hb"><span>${(t.region || '').startsWith('Hometown') ? 'Hometown bonus' : 'Heritage tiebreaker'}</span><span>${esc(t.region || '')}</span><b class="num">+${t.bonus}</b></div>` : ''}</div>` : ''}
    <h4 style="margin-top:18px">Upcoming (${up.length})</h4>
    ${up.length ? `<div class="cf-head"><span>Date</span><span>Opponent</span><span>Win · Draw · Loss</span><span>Pick 'em</span><span>Importance</span></div><p class="note" style="margin:6px 0 0">Scores are shown with ${esc(t.short || t.name)} first.</p>${up.map(rowUp).join('')}` : '<p class="note">No fixtures left.</p>'}
    ${done.length ? `<h4 style="margin-top:18px">Results (${done.length})</h4>${done.slice().reverse().map(rowDone).join('')}` : ''}`;
  if (!$('#detail').open) $('#detail').showModal(); $('#close').onclick = () => $('#detail').close();
}

// ---------------------------------------------------------------- events
document.addEventListener('click', e => {
  const t = e.target.closest('[data-signin],[data-signout],[data-adjadd],[data-adjdel],[data-koenter],[data-kosave],[data-koclear],[data-unllg],[data-live],[data-unlive],[data-pp],[data-unpp],[data-move],[data-follow],[data-club],[data-tmode],[data-view],[data-tab],[data-open],[data-enter],[data-save],[data-clear],[data-step],[data-cstep],[data-reset],[data-go],[data-draw]');
  if (!t) return;
  const k = state.view;
  const card = t.closest('#main [data-fx]'); anchor = card ? {key:card.dataset.fx, top:card.getBoundingClientRect().top} : null; queueMicrotask(() => { anchor = null; });
  if (t.dataset.signin) { signIn(); return; }
  if (t.dataset.signout) { signOut(); return; }
  if (t.dataset.adjadd) { const i = +$('#adj-club').value, p = +$('#adj-sign').value * Math.abs(parseInt(String($('#adj-pts').value).replace(/[^0-9]/g, ''), 10)), n = $('#adj-note').value.trim();
    if (!Number.isInteger(p) || p === 0) return; const st = state.settings[k]; st.adj = [...(st.adj || []), {i, p, n}]; compute(k); render(); save(k); return; }
  if (t.dataset.adjdel) { const st = state.settings[k]; st.adj = (st.adj || []).filter((_, n) => n !== +t.dataset.adjdel); compute(k); render(); save(k); return; }
  if (t.dataset.koenter) { const el = document.getElementById('koe-' + t.dataset.koenter); el.hidden = !el.hidden; return; }
  if (t.dataset.kosave) { const id = t.dataset.kosave, h = parseInt(document.getElementById('kh-' + id).value, 10), a2 = parseInt(document.getElementById('ka-' + id).value, 10), w = document.getElementById('kw-' + id).value;
    if (!(Number.isInteger(h) && Number.isInteger(a2) && h >= 0 && a2 >= 0)) return; if (h === a2 && !w) { alert('Level after 90 minutes: pick who went through.'); return; }
    state.ko[k] = state.ko[k] || {}; state.ko[k][id] = {hs:h, as:a2, adv: h === a2 ? w : null}; compute(k); render(); save(k); return; }
  if (t.dataset.koclear) { delete state.ko[k][t.dataset.koclear]; compute(k); render(); save(k); return; }
  if (t.dataset.unllg) { state.unlLeague = t.dataset.unllg; render(); return; }
  if (t.dataset.live) {
    if (R[k] && R[k].fx[+t.dataset.live]) lockMotw(k, roundKey(k, R[k].fx[+t.dataset.live]));
    const id = +t.dataset.live, h = parseInt($('#hs-' + id).value, 10), a2 = parseInt($('#as-' + id).value, 10), raw = $('#mn-' + id).value.trim().toUpperCase();
    const ht = raw === 'HT', mn = ht ? 45 : parseInt(raw, 10);
    if (!(Number.isInteger(h) && Number.isInteger(a2) && h >= 0 && a2 >= 0 && Number.isInteger(mn) && mn >= 0)) return;
    state.live[k][id] = ht ? {h, a:a2, min:45, ht:1} : {h, a:a2, min:Math.min(mn, 120)}; compute(k); render(); save(k); return;
  }
  if (t.dataset.unlive) { delete state.live[k][+t.dataset.unlive]; compute(k); render(); save(k); return; }
  if (t.dataset.pp || t.dataset.unpp || t.dataset.move) {
    const id = +(t.dataset.pp || t.dataset.unpp || t.dataset.move), st = state.status[k][id] = Object.assign({}, state.status[k][id]);
    if (t.dataset.pp) { st.p = 1; delete st.d; delete st.t; }
    else if (t.dataset.unpp) delete st.p;
    else { const d = $('#nd-' + id).value, tm = $('#nt-' + id).value; if (!d) return; st.d = d; if (tm) st.t = tm; else delete st.t; delete st.p; }
    compute(k); render(); save(k); return;
  }
  if (t.dataset.follow) { const i = +t.dataset.follow, name = T(k)[i].name, on = !isFav(k, i);
    for (const c of ORDER) { const idx = T(c).findIndex(x => x.name === name); if (idx < 0) continue;
      const arr = state.favs[c] = state.favs[c] || [], j = arr.indexOf(idx);
      if (on && j < 0) arr.push(idx); if (!on && j >= 0) arr.splice(j, 1);
      if (c !== k) save(c); }
    save(k); if ($('#detail').open) openClub(k, i); render(); return; }
  if (t.dataset.club) { openClub(k, +t.dataset.club); return; }
  if (t.dataset.tmode) { state.tmode[k] = t.dataset.tmode; render(); return; }
  if (t.dataset.view) { state.view = t.dataset.view; render(); window.scrollTo({top:0}); return; }
  if (t.dataset.go) { const [kk, id] = t.dataset.go.split(':'); state.view = kk; state.tab[kk] = 'week'; const f = R[kk].fx[+id]; state.mw[kk] = f.mw;
    if (kk === 'unl' && f.h != null) state.unlLeague = (T(kk)[f.h].group || 'A')[0];
    render();
    // Land on the match itself, centred, with a brief highlight so it's easy to spot.
    const card = document.querySelector(`#main [data-fx="${kk}:${id}"]`);
    if (card) { card.scrollIntoView({block:'center'}); card.classList.add('flash'); setTimeout(() => card.classList.remove('flash'), 1600); } else window.scrollTo({top:0});
    return; }
  if (t.dataset.tab) { state.tab[k] = t.dataset.tab; render(); window.scrollTo({top:0}); return; }
  if (t.dataset.open) { openDetail(k, +t.dataset.open); return; }
  if (t.dataset.enter) { const el = $('#entry-' + t.dataset.enter); el.hidden = !el.hidden; if (!el.hidden) $('#hs-' + t.dataset.enter).focus({preventScroll:true}); return; }
  if (t.dataset.save) {
    if (R[k] && R[k].fx[+t.dataset.save]) lockMotw(k, roundKey(k, R[k].fx[+t.dataset.save]));
    const id = +t.dataset.save, h = parseInt($('#hs-' + id).value, 10), a = parseInt($('#as-' + id).value, 10);
    if (!(Number.isInteger(h) && Number.isInteger(a) && h >= 0 && a >= 0)) return;
    const f = R[k].fx[id], prev = state.results[k][id];
    if (COMPS_CFG[k].cup) {
      const pwEl = $('#pw-' + id), pw = pwEl && pwEl.value !== '' ? +pwEl.value : null;
      const lock = f.played ? (prev && prev.length >= 6 ? prev.slice(3) : null) : (f.pick ? [f.pick[0], f.pick[1], f.favored] : null);
      state.results[k][id] = lock ? [h, a, pw, ...lock] : [h, a, pw];
    } else {
      const lock = f.played ? (prev && prev.length >= 5 ? prev.slice(2) : null) : [f.pick[0], f.pick[1], f.favored];
      state.results[k][id] = lock ? [h, a, ...lock] : [h, a];
      delete state.live[k][id];
      const aw = $('#aw-' + id); const st = state.status[k][id] = Object.assign({}, state.status[k][id]);
      delete st.p; if (aw && aw.checked) st.aw = 1; else delete st.aw;
    }
    compute(k); render(); save(k); return;
  }
  if (t.dataset.clear) { state.results[k][+t.dataset.clear] = null; compute(k); render(); save(k); return; }
  if (t.dataset.draw) { const id = +t.dataset.draw, h = $('#dh-' + id).value, a = $('#da-' + id).value; if (h === '' || a === '' || h === a) return; state.draws.cup[id] = [+h, +a]; compute('cup'); render(); save('cup'); return; }
  if (t.dataset.step) { const rounds = [...new Set(R[k].fx.map(f => f.mw))].sort((x, y) => x - y); const i = rounds.indexOf(state.mw[k]) + (+t.dataset.step); if (rounds[i] != null) { state.mw[k] = rounds[i]; render(); } return; }
  if (t.dataset.cstep) { const cur = state.mw[k] && state.mw[k].startsWith('Semi') ? 'Semi-finals' : state.mw[k]; const i = CUP_ROUNDS.indexOf(cur) + (+t.dataset.cstep); if (CUP_ROUNDS[i]) { state.mw[k] = CUP_ROUNDS[i] === 'Semi-finals' ? 'Semi-final leg 1' : CUP_ROUNDS[i]; render(); } return; }
  if (t.dataset.reset) { if (confirm('Remove every result you entered or edited here? The results that came with the tracker stay.')) { state.results[t.dataset.reset] = {}; if (t.dataset.reset === 'cup') state.draws.cup = {};
for (const k of ORDER) Object.assign(state.status[k], DATA[k].statusDefault || {}); compute(t.dataset.reset); render(); save(t.dataset.reset); } }
});
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-open],[data-go]')) { e.preventDefault(); e.target.click(); } });
document.addEventListener('change', e => {
  const key = e.target.dataset && e.target.dataset.set; if (!key) return;
  const v = parseFloat(e.target.value); if (isNaN(v)) return;
  if (e.target.dataset.global === '1') { state.suite[key] = v; ORDER.forEach(c => compute(c)); render(); save(state.view); }
  else { state.settings[state.view][key] = v; compute(state.view); render(); save(state.view); }
});
function syncFavs() {
  const names = new Set(); for (const c of ORDER) for (const i of (state.favs[c] || [])) if (T(c)[i]) names.add(T(c)[i].name);
  for (const c of ORDER) { const arr = state.favs[c] = state.favs[c] || []; T(c).forEach((x, i) => { if (names.has(x.name) && !arr.includes(i)) arr.push(i); }); }
}
loadLocal(); syncFavs(); render(); computeAll(); connect();
</script>
